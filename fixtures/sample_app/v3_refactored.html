<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Store - Quest 3S Checkout (Refactored v3)</title>
  <style>
    :root {
      --primary: #0064e0;
      --bg: #0a0c10;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --success: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
    .store-container { max-width: 720px; width: 100%; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .version-tag { font-size: 12px; background: rgba(63, 185, 80, 0.15); color: #3fb950; padding: 4px 8px; border-radius: 12px; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 15px; margin: 20px 0; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .btn-checkout { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .order-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--success); font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="store-container">
    <header>
      <h1>Meta Store Checkout <span class="version-tag">v3.0.0 Refactored Design System</span></h1>
    </header>

    <!-- REFACTOR #1: Search input testid shifted to 'search_catalog_field' -->
    <input 
      type="text" 
      class="search-input" 
      id="search-input-v3" 
      data-testid="search_catalog_field" 
      aria-label="Search catalog input" 
      placeholder="Search Meta catalog..." 
      value="Meta Quest 3S"
    />

    <div class="product-card" id="card-quest-3s">
      <div>
        <h2>Meta Quest 3S (128GB)</h2>
        <p style="color: #58a6ff; font-weight: 700; margin-top: 4px;">$299.99 USD</p>
      </div>
      <!-- REFACTOR #2: Button testid shifted from 'elem_add_to_cart' to 'btn_cart_submit', text updated to 'Add to Cart' -->
      <button 
        type="button" 
        id="btn-cart-v3" 
        data-testid="btn_cart_submit" 
        aria-label="Add to Cart button" 
        class="btn-checkout"
      >
        Add to Cart button
      </button>
    </div>

    <!-- REFACTOR #3: Confirmation badge testid shifted from 'elem_order_badge' to 'order_status_badge' -->
    <div id="confirmation-panel">
      <div 
        id="order-badge-v3" 
        data-testid="order_status_badge" 
        aria-label="Order Confirmation #ORD-9821" 
        class="order-badge"
      >
        ✓ Order Confirmation #ORD-9821
      </div>
    </div>
  </div>
</body>
</html>
