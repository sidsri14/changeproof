<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Store - Quest 3S Checkout (Baseline v1)</title>
  <style>
    :root {
      --primary: #0064e0;
      --primary-hover: #0053ba;
      --bg: #0a0c10;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --success: #238636;
      --success-text: #3fb950;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
    .store-container { max-width: 720px; width: 100%; }
    header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .version-tag { font-size: 12px; background: rgba(56, 139, 253, 0.15); color: #58a6ff; padding: 4px 8px; border-radius: 12px; border: 1px solid rgba(56, 139, 253, 0.4); }
    .search-bar { margin: 20px 0; }
    .search-input { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 15px; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .product-details h2 { font-size: 18px; margin-bottom: 6px; }
    .product-details .price { font-size: 20px; font-weight: 700; color: #58a6ff; }
    .btn-primary { background: var(--primary); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .btn-primary:hover { background: var(--primary-hover); }
    .order-status-card { background: rgba(35, 134, 54, 0.1); border: 1px solid rgba(46, 160, 67, 0.4); border-radius: 12px; padding: 20px; margin-top: 20px; }
    .order-badge { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--success-text); font-size: 16px; }
  </style>
</head>
<body>
  <div class="store-container">
    <header>
      <h1>Meta Store Checkout <span class="version-tag">v1.0.0 Baseline</span></h1>
    </header>

    <div class="search-bar">
      <input 
        type="text" 
        class="search-input" 
        id="catalog-search" 
        data-testid="elem_search" 
        aria-label="Search catalog input" 
        placeholder="Search Meta catalog..." 
        value="Meta Quest 3S"
      />
    </div>

    <div class="product-card" id="product-meta-quest-3s">
      <div class="product-details">
        <h2>Meta Quest 3S (128GB)</h2>
        <p class="price">$299.99 USD</p>
      </div>
      <button 
        type="button" 
        id="btn-add-to-cart" 
        data-testid="elem_add_to_cart" 
        aria-label="Add to Cart button" 
        class="btn-primary"
      >
        Add to Cart button
      </button>
    </div>

    <div class="order-status-card" id="order-confirmation-section">
      <div 
        id="order-confirmation-badge" 
        data-testid="elem_order_badge" 
        aria-label="Order Confirmation #ORD-9821" 
        class="order-badge"
      >
        ✓ Order Confirmation #ORD-9821
      </div>
      <p style="margin-top: 8px; font-size: 13px; color: var(--text-muted);">
        Hardware order successfully placed. Estimated delivery in 2-3 business days.
      </p>
    </div>
  </div>
</body>
</html>
