name: ChangeProof CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Verify (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build TypeScript distribution
        run: npm run build

      - name: Run automated test suite (31 tests)
        run: npm test

      - name: Run visual regression verification
        run: npm run test:regression

      - name: Run autonomous self-healing evaluation
        run: npm run test:repair

      - name: Run empirical multimodal benchmark
        run: npm run benchmark

      - name: Upload benchmark report artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: changeproof-benchmark-report
          path: |
            benchmark_report.json
            benchmark_report.md
